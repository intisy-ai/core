// Includes a gradle module that lives inside a sibling submodule.
//
// Gradle settings do not nest, so every consumer has to re-declare the modules its
// submodules provide. Declaring them by path duplicates the same
// "<submodule>/java/<module>" convention in each repo, which is what drifts. The
// convention lives here instead, so a settings.gradle names the module it wants and
// the submodule that supplies it.
//
// The submodule is named rather than searched for on purpose: several submodules ship
// a module called "teavm" (core-proxy and core-ir both do), so searching would pick one
// by directory order and silently compile a different module than intended.
//
// Usage, from a repo's java/settings.gradle:
//   apply from: file("../core/gradle/submodule-modules.gradle")
//   includeFromSubmodule ":routing", "core-proxy"

ext.includeFromSubmodule = { String path, String submodule ->
  def name = path.startsWith(":") ? path.substring(1) : path
  def dir = file("../${submodule}/java/${name}")
  if (!dir.isDirectory()) {
    throw new GradleException(
      "settings.gradle asks for ${path} from '${submodule}', but ${dir} does not exist. " +
      "The submodule is probably not checked out (git submodule update --init --recursive)."
    )
  }
  include path
  project(path).projectDir = dir
}
