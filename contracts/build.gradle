// The annotations are SOURCE-retention and the api contract supplies only the typed-key interfaces,
// so both are compileOnly: this module's jar carries neither, and nothing here runs at run time.
dependencies {
    githubCompileOnly "intisy-ai:api:1.0.1:annotations"
    githubCompileOnly "intisy-ai:api:1.0.1:contract"
    // A release asset carries no transitive metadata, so the processor's own annotation types are
    // named here too, alongside the compile classpath's copy.
    githubAnnotationProcessor "intisy-ai:api:1.0.1:processor"
    githubAnnotationProcessor "intisy-ai:api:1.0.1:annotations"
}

tasks.named("compileJava") {
    options.compilerArgs += [
        "-Atsemit.name=contracts",
        // A compilable .ts rather than an ambient .d.ts: this repo's whole TypeScript surface IS the
        // emitted file, and tsc copies a declaration file to no output directory.
        "-Atsemit.ext=.ts",
        "-Atsemit.keys=@intisy-ai/api/contract",
    ]
}
