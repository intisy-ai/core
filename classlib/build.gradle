import org.teavm.gradle.api.JSModuleType
import org.teavm.gradle.api.OptimizationLevel

plugins {
    id "io.github.intisy.brazier" version "0.2.0"
}

repositories {
    maven { url = uri("https://intisy.github.io/brazier/maven") }
}

// A shared runtime is built from the classes it is TOLD to carry, in two halves that cover different
// ground. The jars name every first-party class, so that half cannot go stale. The list names the
// class-library classes, which no jar can supply: TeaVM emits a merely reachable class only where it
// overrides an ancestor, so a JDK class is complete only when it is seeded by name.
def seedJars = files(
    project(":runtime").tasks.named("jar"),
    project(":contracts").tasks.named("jar")
)

// api's jars are seeded too, and may be: the api is layer 1, so this reference points downward. Its
// seam is what every consuming bundle reaches through, which is why naming it here removes the most
// weight from the most bundles. api's OWN bundle cannot import the result, being a layer below what
// produces it, so it keeps a private copy; that is the stranding this arrangement accepts.
def apiSeedJars = files(configurations.compileClasspath.filter { it.name.startsWith("api-") })

dependencies {
    implementation project(":runtime")
    implementation project(":contracts")
    githubImplementation "intisy-ai:api:1.6.0:contract"
    githubImplementation "intisy-ai:api:1.6.0:seam"
    githubImplementation "intisy-ai:api:1.6.0:js-base"
    teavm teavm.libs.jsoApis
}

// The root subprojects{} block pins Java 8 for the portability of :runtime, and TeaVM's own artifacts
// publish minimum-JVM metadata above that, so this module compiles at 17 like every other :teavm one.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.named("compileJava") {
    options.release = 17
}

tasks.named("compileTestJava") {
    options.release = 17
}

teavm.js {
    mainClass = "io.github.intisy.ai.classlib.Empty"
    moduleType = JSModuleType.ES2015
    obfuscated = false
    sourceMap = false
    optimization = OptimizationLevel.NONE
    targetFileName = "runtime.js"
    // Every consumer names a member by the same alias only if both sides derive it the same way, so
    // sharing is impossible without this.
    deterministicNames = true
    sharedRuntimeFromDependencies.from(seedJars)
    sharedRuntimeFromDependencies.from(apiSeedJars)
    sharedRuntimeClassesFile = file("runtime-classes.txt").absolutePath
    // Written straight into the staging directory: a consumer's Gradle build reads this file
    // out of the installed package, so it has to ship beside the bundle it describes.
    sharedRuntimeManifest = rootProject.file("src/generated/runtime.manifest.json").absolutePath
}
