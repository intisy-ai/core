import org.teavm.gradle.api.JSModuleType
import org.teavm.gradle.api.OptimizationLevel

plugins {
    id "org.teavm" version "0.15.0"
}

dependencies {
    // :runtime -- the engines this JS export surface wraps.
    implementation project(":runtime")
    // :seam carries SimpleJsonCodec and the narrowing helpers; CoreJs lives in :js-base's own package
    // (io.github.intisy.ai.js) so it references them unqualified.
    // :contract for the JsonCodec seam this surface names directly; :runtime declares :seam as
    // implementation, which does not propagate onto this module's compile classpath.
    githubImplementation "intisy-ai:api:1.3.0:contract"
    githubImplementation "intisy-ai:api:1.3.0:seam"
    githubImplementation "intisy-ai:api:1.3.0:js-base"
    // SOURCE-retention, so nothing here reaches the bundle. The processor jar is a release asset and
    // carries no transitive metadata, so the annotation types it reads are named beside it.
    githubCompileOnly "intisy-ai:api:1.3.0:annotations"
    githubAnnotationProcessor "intisy-ai:api:1.3.0:processor"
    githubAnnotationProcessor "intisy-ai:api:1.3.0:annotations"
    teavm teavm.libs.jsoApis
}

// The root subprojects{} block pins Java 8 for the portability of :runtime. TeaVM 0.15.0's own
// artifacts publish minimum-JVM metadata of 11 to 17, so this module needs a newer compile target
// than the engine it wraps, on both compile tasks.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.named("compileJava") {
    options.release = 17
    options.compilerArgs << "-Atsemit.name=core.teavm"
}

tasks.named("compileTestJava") {
    options.release = 17
}

teavm.js {
    mainClass = "io.github.intisy.ai.js.CoreJs"
    moduleType = JSModuleType.ES2015
    obfuscated = false
    optimization = OptimizationLevel.NONE
    targetFileName = "core.js"
}
